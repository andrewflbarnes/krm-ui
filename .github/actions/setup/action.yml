name: 'Setup'
description: 'Setup pnpm, repo and cache'
runs:
  using: "composite"
  steps:
    # https://github.com/pnpm/pnpm/issues/9191
    - name: Set up pnpm global bin directory`
      run: |
        PNPM_HOME=/home/runner/.local/share/pnpm
        mkdir -p "$PNPM_HOME"
        echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
        echo "$PNPM_HOME" >> "$GITHUB_PATH"
      shell: bash
    - name: Enable corepack
      run: npx --yes corepack@latest enable --install-directory "$PNPM_HOME"
      shell: bash
    - name: Cache
      uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
        cache: 'pnpm'
        cache-dependency-path: |
          pnpm-lock.yaml
          netlify/functions/ksc-results/pnpm-lock.yaml
    - name: Install
      run: |
        pnpm install
      shell: bash
