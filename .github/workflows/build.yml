name: Test and Deploy

permissions:
  contents: read

on:
  push:
    branches: ["main"]

  # Allows manual executions
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "build"
  cancel-in-progress: false

jobs:
  smoke:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup
      uses: ./.github/actions/setup
    - name: Setup Playwright
      uses: ./.github/actions/playwright
    - name: Run Playwright tests
      run: pnpm e2e:smoke
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test
        run: pnpm test
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Check TS violations
        run: pnpm check
      - name: Check ESLint violations
        run: pnpm lint
  deploy:
    needs: [test, check, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Update version
        run: .github/update_version.sh
      - name: Cache netlify-cli
        id: netlify-cache
        uses: actions/cache@v4
        with:
          path: ~/.netlify-cli
          key: netlify-cli-${{ runner.os }}-27
      - name: Install netlify
        if: steps.netlify-cache.outputs.cache-hit != 'true'
        run: npm install -g netlify-cli@27 --prefix ~/.netlify-cli
      - name: Add netlify to PATH
        run: echo "$HOME/.netlify-cli/bin" >> $GITHUB_PATH
      - name: Build and deploy to Netlify
        env:
          NODE_ENV: production
          VITE_CLERK_PUBLISHABLE_KEY: "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}"
          NETLIFY_SITE_ID: "${{ secrets.NETLIFY_SITE_ID }}"
          NETLIFY_AUTH_TOKEN: "${{ secrets.NETLIFY_API_TOKEN }}"
        run: .github/deploy.sh
